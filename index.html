<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>T&H — Revente de luxe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#0b0b0b; --card:#0f0f0f; --muted:#bdbdbd; --white:#ffffff; --accent:#000; --radius:12px;
}
body{margin:0;font-family:Inter,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--white);}
a{text-decoration:none;color:inherit;}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 4%;border-bottom:1px solid rgba(255,255,255,0.04);}
header .brand{font-weight:700;font-size:24px;font-family:Georgia,serif;cursor:pointer;}
header nav{display:flex;gap:20px;align-items:center;}
header nav a{font-size:16px;color:var(--white);}
.products{max-width:1200px;margin:28px auto;padding:0 4%;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;}
.card{background:var(--card);border-radius:12px;padding:14px;border:1px solid rgba(255,255,255,0.03);overflow:hidden;cursor:pointer;transition:transform .28s ease,box-shadow .28s ease;}
.card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 20px 40px rgba(0,0,0,0.6);}
.card img{width:100%;height:260px;object-fit:cover;border-radius:10px;}
.card h3{margin:10px 0 0;font-size:16px;}
.price{color:var(--white);font-weight:800;margin-top:6px;}
.modal-bg{display:none;position:fixed;inset:0;z-index:80;align-items:center;justify-content:center;background:rgba(0,0,0,0.55);}
.modal{width:92%;max-width:800px;background:var(--white);color:#000;border-radius:14px;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:18px;transform:translateY(18px) scale(.96);opacity:0;transition:all .36s cubic-bezier(.2,.9,.2,1);}
.modal.show{transform:translateY(0) scale(1);opacity:1;}
.modal img{width:100%;height:360px;object-fit:cover;border-radius:10px;}
.modal h2{margin:0 0 6px;}
.modal p{color:#333;margin:0 0 12px;}
.modal .price{font-size:20px;color:#111;}
.modal .actions{display:flex;gap:10px;margin-top:8px;}
.btn-outline{background:transparent;border:1px solid #111;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:700;}
.btn-primary{background:#111;color:#fff;border:none;padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:800;}
.cart-modal{position:fixed;right:20px;top:20px;width:360px;background:#fff;color:#000;border-radius:12px;padding:14px;box-shadow:0 30px 60px rgba(0,0,0,0.6);z-index:90;display:none;}
.cart-modal h3{margin:0 0 10px;}
.cart-items{max-height:320px;overflow:auto;margin-top:8px;}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.06);}
.qty{display:flex;gap:6px;align-items:center;}
.small{font-size:13px;color:var(--muted);}
#mini-cart{position:fixed;bottom:20px;right:20px;z-index:99;}
</style>
</head>
<body>

<header>
  <div class="brand" onclick="showPage('home')">T&H</div>
  <nav>
    <a href="#" onclick="showPage('home')">Produits</a>
    <a href="#" onclick="showPage('about')">À propos</a>
    <a href="#" onclick="toggleCart()">Panier <span id="cart-count">0</span></a>
  </nav>
</header>

<section id="home">
  <div class="products" id="products"></div>
</section>

<section id="about" style="display:none;max-width:800px;margin:40px auto;padding:0 4%;">
  <h1>À propos</h1>
  <p class="small">T&H est un projet en NSI réalisé par Hafsi et Tiago. Ce site est une démonstration de plateforme de revente de luxe.</p>
</section>

<div class="modal-bg" id="modal-bg">
  <div class="modal" id="modal">
    <div><img id="modal-img" src="" alt="visuel produit"></div>
    <div>
      <h2 id="modal-name"></h2>
      <p id="modal-desc" class="small"></p>
      <div class="price" id="modal-price"></div>
      <div class="actions">
        <button class="btn-outline" id="btn-add">Ajouter au panier</button>
        <button class="btn-primary" onclick="closeModal()">Fermer</button>
      </div>
    </div>
  </div>
</div>

<div class="cart-modal" id="cart-modal">
  <h3>Votre panier</h3>
  <div class="cart-items" id="cart-items"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
    <div class="small">Total : <strong id="cart-total">0 €</strong></div>
    <div style="display:flex;gap:8px">
      <button class="btn-outline" onclick="clearCart()">Vider</button>
      <button class="btn-primary" onclick="checkout()">Payer</button>
      <button class="btn-outline" onclick="toggleCart()">Fermer</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY='th_cart_v2';
let cart=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');

const products=[
  {id:'lv-bonnet',name:'Bonnet LV',price:350,image:'https://fr.louisvuitton.com/images/is/image/lv/1/PP_VP_L/louis-vuitton-bonnet-neo-petit-damier--M77985_PM2_Front%20view.png?wid=2400&hei=2400',desc:'Bonnet de luxe en laine premium.'},
  {id:'gucci-bag',name:'Sac Gucci GG',price:1800,image:'https://media.gucci.com/style/White_Center_0_0_150x150/1715076904/792080_FADJQ_1185_001_100_0000_Light-sac-a-dosgg-black-grand-format.jpg',desc:'Sac en cuir Gucci avec logo GG.'},
  {id:'rolex-submariner',name:'Montre Rolex Submariner',price:12500,image:'https://medias.collectorsquare.com/images/products/425073/00pp-g-montre-rolex-submariner-date-en-acier-ref-rolex-116610-vers-2010.jpg',desc:'Montre Rolex Submariner en acier.'},
  {id:'hermes-birkin',name:'Sac Hermès',price:9800,image:'https://www.lesfoliesdeugenie.fr/cdn/shop/files/3B3EC089-9174-43E3-B467-2BA7995E937C.jpg?v=1758041349&width=1100',desc:'Sac Hermès Birkin en cuir de haute qualité.'},
  {id:'dior-sunglasses',name:'Lunettes Dior',price:450,image:'https://assets2.nuanceaudio.com/cdn-record-files-pi/7d54dc3b-8d86-4dd1-b20e-b16f00e7f713/7ecda61c-a1ce-4f9a-b8e9-b16f00eb45a0/0AW5001__04__P21__shad__qt.png?impolicy=NUA_resize&wid=900&bgc=%23F6F6F6',desc:'Lunettes de soleil Dior.'},
  {id:'louboutin-shoes',name:'Chaussures Louboutin',price:850,image:'https://eu.christianlouboutin.com/media/catalog/product/cache/2687d9ba4029f1eb6acb91746b133704/3/2/3250025b439-3250025b439-main_image-ecommerce-christianlouboutin-missz-3250025_b439_1_1200x1200_202507100300.jpg',desc:'Chaussures Christian Louboutin.'},
  {id:'moncler-jacket',name:'Veste Moncler',price:1250,image:'https://www.net-a-porter.com/variants/images/46376663162953284/in/w2000_q60.jpg',desc:'Veste Moncler chaude et élégante.'},
  {id:'prada-pouch',name:'Pochette Prada',price:980,image:'https://www.prada.com/content/dam/pradabkg_products/2/2NA/2NA819/PN9F0002/2NA819_PN9_F0002_SLF.jpg/_jcr_content/renditions/cq5dam.web.hebebed.1000.1000.jpg',desc:'Pochette Prada en cuir.'},
  {id:'lv-scarf',name:'Écharpe LV',price:420,image:'https://fr.louisvuitton.com/images/is/image/lv/1/PP_VP_L/louis-vuitton-echarpe-monogram-classic--M70520_PM2_Front%20view.png?wid=2400&hei=2400',desc:'Écharpe Louis Vuitton Monogram.'},
  {id:'balenciaga-hoodie',name:'Hoodie Balenciaga',price:650,image:'https://balenciaga.dam.kering.com/asset/d87f0aa5-3044-4164-95c1-110ff79946a0/eCom/767877TSV889374_F.jpg?v=2',desc:'Sweat à capuche Balenciaga.'},
  {id:'chanel-bag',name:'Sac Chanel',price:4200,image:'https://www.chanel.com/images///f_auto,q_auto:good,dpr_1.1/w_1920/-9555559284766.jpg',desc:'Sac iconique Chanel Classic Flap.'},
  {id:'prada-shoes',name:'Chaussures Prada',price:890,image:'https://www.prada.com/content/dam/pradabkg_products/4/4E3/4E3400/ASZF0QKD/4E3400_ASZ_F0QKD_F_G000_SLR.jpg/_jcr_content/renditions/cq5dam.web.hebebed.1000.1000.jpg',desc:'Chaussures en cuir Prada élégantes.'},
];

function saveCart(){localStorage.setItem(STORAGE_KEY,JSON.stringify(cart));renderCartCount();renderCartItems();}
function addToCart(item){let found=cart.find(i=>i.id===item.id);if(found)found.qty+=1;else cart.push({...item,qty:1});saveCart();}
function removeFromCart(id){cart=cart.filter(i=>i.id!==id);saveCart();}
function clearCart(){cart=[];saveCart();}
function cartTotal(){return cart.reduce((s,i)=>s+i.price*i.qty,0);}
function cartCount(){return cart.reduce((s,i)=>s+i.qty,0);}
function renderCartCount(){document.getElementById('cart-count').textContent=cartCount();}
function renderCartItems(){
  const el=document.getElementById('cart-items');
  if(cart.length===0){el.innerHTML='<div class="small">Votre panier est vide.</div>';document.getElementById('cart-total').textContent='0 €';return;}
  el.innerHTML=cart.map(i=>`<div class="cart-item">
    <div><div style="font-weight:700">${i.name}</div><div class="small">${i.price} €</div></div>
    <div class="qty">
      <button class="btn-outline" onclick="decrementQty('${i.id}')">-</button>
      <div>${i.qty}</div>
      <button class="btn-outline" onclick="incrementQty('${i.id}')">+</button>
      <button class="btn-outline" onclick="removeFromCart('${i.id}')">✕</button>
    </div>
  </div>`).join('');
  document.getElementById('cart-total').textContent=cartTotal()+' €';
}
function incrementQty(id){let item=cart.find(x=>x.id===id);if(item){item.qty++;saveCart();}}
function decrementQty(id){let item=cart.find(x=>x.id===id);if(item){item.qty--;if(item.qty<=0)removeFromCart(id);else saveCart();}}

function renderProducts(){
  const container=document.getElementById('products');
  container.innerHTML=products.map(p=>`<div class="card" onclick="openProduct('${p.id}')">
    <img src="${p.image}" alt="">
    <h3>${p.name}</h3>
    <div class="price">${p.price} €</div>
  </div>`).join('');
}

let currentProduct=null;
function openProduct(id){
  currentProduct=products.find(p=>p.id===id);
  document.getElementById('modal-img').src=currentProduct.image;
  document.getElementById('modal-name').textContent=currentProduct.name;
  document.getElementById('modal-desc').textContent=currentProduct.desc;
  document.getElementById('modal-price').textContent=currentProduct.price+' €';
  document.getElementById('modal-bg').style.display='flex';
  setTimeout(()=>document.getElementById('modal').classList.add('show'),50);
}
function closeModal(){document.getElementById('modal').classList.remove('show');setTimeout(()=>document.getElementById('modal-bg').style.display='none',300);}
document.getElementById('btn-add').addEventListener('click',()=>{
  if(currentProduct){addToCart(currentProduct);document.getElementById('btn-add').textContent='Ajouté ✓';setTimeout(()=>{document.getElementById('btn-add').textContent='Ajouter au panier';},900);}
});

function toggleCart(){
  const cm=document.getElementById('cart-modal');
  cm.style.display=cm.style.display==='block'?'none':'block';
  renderCartItems();
}

function checkout(){alert('Paiement fictif — projet NSI.');}

function showPage(page){
  document.getElementById('home').style.display=page==='home'?'block':'none';
  document.getElementById('about').style.display=page==='about'?'block':'none';
}

renderProducts();
renderCartCount();
renderCartItems();
</script>
</body>
</html>
