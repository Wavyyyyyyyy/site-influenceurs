<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>T&H – Boutique Luxe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Helvetica', sans-serif;
            background: #f4f4f4;
            color: #111;
        }

        /* HEADER */
        header {
            background: #000;
            color: #fff;
            padding: 25px;
            text-align: center;
            letter-spacing: 2px;
            font-size: 22px;
            font-weight: bold;
        }

        /* NAVBAR */
        nav {
            background: #111;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin-right: 20px;
            font-size: 16px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .search-bar {
            padding: 8px 15px;
            border-radius: 20px;
            border: none;
            width: 180px;
        }

        /* SECTION TITLES */
        h2 {
            text-align: center;
            padding-top: 40px;
            font-weight: bold;
            color: #000;
        }

        /* PRODUCT GRID */
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            padding: 40px;
            max-width: 1300px;
            margin: auto;
        }

        /* PRODUCT CARD */
        .product-card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: 0.3s ease;
            cursor: pointer;
            border: 1px solid #ddd;
        }

        .product-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .product-card img {
            width: 100%;
            border-radius: 10px;
        }

        .price {
            font-weight: bold;
            margin-top: 10px;
        }

        /* MODAL */
        .modal-bg {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            justify-content: center;
            align-items: center;
        }

        .modal {
            background: #fff;
            width: 90%;
            max-width: 500px;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            animation: modalOpen 0.35s ease-out forwards;
        }

        @keyframes modalOpen {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1); }
        }

        .modal img {
            width: 90%;
            border-radius: 10px;
        }

        .close {
            margin-top: 15px;
            padding: 10px 20px;
            background: #000;
            color: #fff;
            border: none;
            cursor: pointer;
        }

        /* CONTACT SECTION */
        .contact {
            background: #fff;
            padding: 40px;
            margin-top: 40px;
        }

        .contact h3 {
            text-align: center;
        }

        .contact p {
            text-align: center;
            font-size: 17px;
        }

        /* FOOTER */
        footer {
            background: #000;
            color: #fff;
            text-align: center;
            padding: 25px;
            margin-top: 40px;
        }

    </style>
</head>

<body>

<header>T&H — Boutique Luxe</header>

<nav>
    <div>
        <a href="#">Accueil</a>
        <a href="#">Produits</a>
        <a href="#">Contact</a>
    </div>
    <input type="text" class="search-bar" placeholder="Rechercher...">
</nav>

<h2>Nos Produits</h2>

<div class="products">

    <!-- PRODUCT 1 -->
    <div class="product-card" data-name="Bonnet Louis Vuitton" data-price="350€" data-description="Bonnet de luxe en laine premium." data-image="https://fr.louisvuitton.com/images/is/image/lv/1/PP_VP_L/louis-vuitton-bonnet-neo-petit-damier--M77985_PM2_Front%20view.png?wid=2400&hei=2400">
        <img src="https://fr.louisvuitton.com/images/is/image/lv/1/PP_VP_L/louis-vuitton-bonnet-neo-petit-damier--M77985_PM2_Front%20view.png?wid=2400&hei=2400">
        <h3>Bonnet LV</h3>
        <p class="price">350€</p>
    </div>

    <!-- PRODUCT 2 -->
    <div class="product-card" data-name="Écharpe Louis Vuitton" data-price="490€" data-description="Écharpe longue en cachemire ultra doux." data-image="https://encrypted-tbn3.gstatic.com/shopping?q=tbn:ANd9GcSRLkFbv_qIg5uzR4g2LbhomePBugfQryHt5CEH0Ff_-AR4BN3AYdoSiVr5i5EhiAAdOIMzU0nm4EAzZ73WNyDYqh12F0ImLpSdQ5lxE1gsBqaj47fM3h21JA">
        <img src="https://fr.louisvuitton.com/images/is/image/lv/1/PP_VP_L/louis-vuitton-echarpe-monogram-classic--M70520_PM2_Front%20view.png?wid=730&hei=730">
        <h3>Écharpe LV</h3>
        <p class="price">490€</p>
    </div>

    <!-- PRODUCT 3 -->
    <div class="product-card" data-name="Sac LV Noir" data-price="2000€" data-description="Sac à main noir en cuir haut de gamme." data-image="https://fr.louisvuitton.com/images/is/image/lv/1/PP_VP_L/louis-vuitton-sac-keepall-bandouliere%2055--M40605_PM2_Front%20view.png?wid=730&hei=730">
        <img src="https://fr.louisvuitton.com/images/is/image/lv/1/PP_VP_L/louis-vuitton-sac-keepall-bandouliere%2055--M40605_PM2_Front%20view.png?wid=730&hei=730">
        <h3>Sac LV Noir</h3>
        <p class="price">2000€</p>
    </div>

</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg">
    <div class="modal" id="modal">
        <img id="modal-img">
        <h2 id="modal-name"></h2>
        <p id="modal-description"></p>
        <h3 id="modal-price"></h3>
        <button class="close" onclick="closeModal()">Fermer</button>
    </div>
</div>

<!-- CONTACT -->
<div class="contact">
    <h3>Contact</h3>
    <p>Email : support@th-luxe.com</p>
    <p>Instagram : @th.luxe.store</p>
</div>

<!-- FOOTER -->
<footer>
    © 2025 — T&H Boutique Luxe — Tous droits réservés
</footer>

<script>
    let cards = document.querySelectorAll(".product-card");

    cards.forEach(card => {
        card.addEventListener("click", () => {
            document.getElementById("modal-name").textContent = card.dataset.name;
            document.getElementById("modal-price").textContent = card.dataset.price;
            document.getElementById("modal-description").textContent = card.dataset.description;
            document.getElementById("modal-img").src = card.dataset.image;

            document.getElementById("modal-bg").style.display = "flex";
        });
    });

    function closeModal() {
        document.getElementById("modal-bg").style.display = "none";
    }
</script>

</body>
</html>
